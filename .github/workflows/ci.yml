# Continuous integration for every push and pull request.
# No AWS credentials exist in CI: Terraform is checked with fmt/validate/lint/security scans and `terraform test`
# on a mocked provider, so nothing can be provisioned from here (blueprint Phase 8).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend:
    name: Dashboard (types, unit, build, e2e)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - name: End-to-end tests against the production build (desktop, phone, axe)
        run: npm run test:e2e
      - name: Public bundle must not contain job-runner code
        run: |
          if grep -lE '__runner|runnerToken|bdr_runner' dist/assets/*.js; then
            echo "::error::job-runner code leaked into the GitHub Pages bundle"; exit 1
          fi

  cms-and-engine:
    name: CMS and backup engine (real PostgreSQL)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: cooperative-system
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: CMS tests (FastAPI + PostgreSQL 16)
        run: docker compose --profile test run --rm -T tests
      - name: Backup engine tests (backup, verify, corruption detection, retention)
        run: docker compose --profile backup-test run --rm -T backup-tests
      - name: Clean up
        if: always()
        run: docker compose --profile test --profile backup-test down -v

  runner:
    name: Recovery job runner
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-runner.txt
      - run: pip install -r requirements-runner.txt
      - run: python -m pytest runner_tests -q -p no:cacheprovider

  terraform:
    name: Terraform (fmt, validate, test, lint, security)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TF_IN_AUTOMATION: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.16.6
          terraform_wrapper: false
      - name: Format
        run: terraform fmt -recursive -check -diff terraform
      - name: Validate (no backend, no credentials)
        run: |
          for d in terraform/environments/recovery terraform/bootstrap; do
            terraform -chdir="$d" init -backend=false -input=false
            terraform -chdir="$d" validate
          done
      - name: terraform test (mocked AWS provider)
        run: terraform -chdir=terraform/environments/recovery test
      - uses: terraform-linters/setup-tflint@90f302c255ef959cbfb4bd10581afecdb7ece3e6 # v4.1.1
        with:
          tflint_version: v0.65.0
      - name: TFLint (AWS ruleset)
        env:
          GITHUB_TOKEN: ${{ github.token }} # only to avoid GitHub API rate limits when downloading the ruleset
        run: |
          cd terraform
          tflint --init --config="$PWD/.tflint.hcl"
          for d in modules/* environments/recovery bootstrap; do
            tflint --chdir="$d" --config="$PWD/.tflint.hcl"
          done
      - name: Trivy misconfiguration scan (accepted findings are annotated in code, see ADR-012)
        run: docker run --rm -v "$PWD/terraform:/src:ro" aquasec/trivy:0.76.1 config --quiet --exit-code 1 /src
      - name: ShellCheck the rendered recovery-host bootstrap script
        run: |
          python3 scripts/validation/render_bootstrap.py terraform/modules/compute/templates/bootstrap.sh.tftpl "$RUNNER_TEMP/bootstrap.sh"
          bash -n "$RUNNER_TEMP/bootstrap.sh"
          shellcheck -S warning "$RUNNER_TEMP/bootstrap.sh"
