name: bfc-cms

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cms-local-dev-only}
      POSTGRES_DB: ${POSTGRES_DB:-cms}
    volumes:
      - cms_pgdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/10-init-test-db.sql:ro
    ports:
      - "127.0.0.1:5432:5432" # loopback only; never exposed to the LAN
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      target: runtime
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-cms}:${POSTGRES_PASSWORD:-cms-local-dev-only}@db:5432/${POSTGRES_DB:-cms}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${CMS_API_PORT:-8000}:8000"
    restart: unless-stopped

  # Test runner (only started with `--profile test`). Uses the isolated cms_test database.
  tests:
    profiles: ["test"]
    build:
      context: .
      target: test
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-cms}:${POSTGRES_PASSWORD:-cms-local-dev-only}@db:5432/cms_test
    depends_on:
      db:
        condition: service_healthy

  # ---- BayanihanDR backup engine (System B, Phase 3). Started with `--profile backup`. ----

  # Disposable PostgreSQL used only to prove backups restore. Data lives in RAM and vanishes on stop.
  verify-db:
    profiles: ["backup", "backup-test"]
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: ${BDR_VERIFY_PASSWORD:-verify-local-dev-only}
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Hourly backup -> verify -> retention -> status.json. Archives go to <repo>/backups (git-ignored).
  backup:
    profiles: ["backup"]
    build:
      context: ../backend
      target: runtime
    environment:
      BDR_SOURCE_HOST: db
      BDR_SOURCE_USER: ${POSTGRES_USER:-cms}
      BDR_SOURCE_PASSWORD: ${POSTGRES_PASSWORD:-cms-local-dev-only}
      BDR_SOURCE_DB: ${POSTGRES_DB:-cms}
      BDR_VERIFY_HOST: verify-db
      BDR_VERIFY_USER: postgres
      BDR_VERIFY_PASSWORD: ${BDR_VERIFY_PASSWORD:-verify-local-dev-only}
      BDR_INTERVAL_MINUTES: ${BDR_INTERVAL_MINUTES:-60}
      # Off-site copies (Phase 5). Unset bucket = disabled. Credentials are short-lived (1 h) role credentials
      # passed through from the operator's shell for the run; they are never written to a file.
      BDR_OFFSITE_BUCKET: ${BDR_OFFSITE_BUCKET:-}
      AWS_REGION: ap-southeast-1
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
    volumes:
      - ../backups:/backups
    depends_on:
      db:
        condition: service_healthy
      verify-db:
        condition: service_healthy
    restart: unless-stopped

  # Engine test suite against the disposable verify-db (never touches the CMS database).
  backup-tests:
    profiles: ["backup-test"]
    build:
      context: ../backend
      target: test
    environment:
      BDR_TEST_PG_HOST: verify-db
      BDR_TEST_PG_USER: postgres
      BDR_TEST_PG_PASSWORD: ${BDR_VERIFY_PASSWORD:-verify-local-dev-only}
    depends_on:
      verify-db:
        condition: service_healthy

volumes:
  cms_pgdata:
